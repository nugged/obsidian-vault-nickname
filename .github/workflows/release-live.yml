name: Build and release nugged/live

on:
  push:
    branches:
      - nugged/live
    paths:
      - .github/live-release-version

permissions:
  contents: write

concurrency:
  group: nugged-live-release
  cancel-in-progress: false

env:
  RELEASE_PLUGIN_ID: vault-nickname-nugged
  RELEASE_PLUGIN_NAME: Vault Nickname (nugged)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .github/live-release-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build production bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          node esbuild.config.mjs production
          test -s main.js

      - name: Package release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p "dist/$RELEASE_PLUGIN_ID"
          cp main.js dist/main.js

          VERSION="$VERSION" \
          PLUGIN_ID="$RELEASE_PLUGIN_ID" \
          PLUGIN_NAME="$RELEASE_PLUGIN_NAME" \
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PLUGIN_ID;
          manifest.name = process.env.PLUGIN_NAME;
          manifest.version = process.env.VERSION;
          fs.writeFileSync('dist/manifest.json', JSON.stringify(manifest, null, 4) + '\n');
          NODE

          cp dist/main.js "dist/$RELEASE_PLUGIN_ID/main.js"
          cp dist/manifest.json "dist/$RELEASE_PLUGIN_ID/manifest.json"

          if [[ -f styles.css ]]; then
            cp styles.css dist/styles.css
            cp styles.css "dist/$RELEASE_PLUGIN_ID/styles.css"
          fi

          jq -e \
            --arg id "$RELEASE_PLUGIN_ID" \
            --arg name "$RELEASE_PLUGIN_NAME" \
            --arg version "$VERSION" \
            '.id == $id and .name == $name and .version == $version' \
            dist/manifest.json >/dev/null

          (
            cd dist
            zip -qr "${RELEASE_PLUGIN_ID}-${VERSION}.zip" "$RELEASE_PLUGIN_ID"
            sha256sum \
              main.js \
              manifest.json \
              "${RELEASE_PLUGIN_ID}-${VERSION}.zip" \
              > SHA256SUMS
            if [[ -f styles.css ]]; then
              sha256sum styles.css >> SHA256SUMS
            fi
          )

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi

          cat > /tmp/release-notes.md <<EOF
          Personal prerelease built automatically from \`nugged/live\`.

          Source commit: \`${GITHUB_SHA}\`
          Plugin id: \`${RELEASE_PLUGIN_ID}\` (intentionally distinct from upstream \`vault-nickname\`, so Obsidian's native updater does not associate this personal build with upstream releases).

          Includes the configurable nickname-storage work from upstream PR #9 plus the already-open-vault switcher fix adapted from davidvkimball/obsidian-vault-nickname@4934b18395ae62ea7d5e0a023c3f7fbe9accb29c.

          Install manually from the attached files/ZIP, or add \`nugged/obsidian-vault-nickname\` to BRAT.
          EOF

          assets=(
            dist/main.js
            dist/manifest.json
            dist/SHA256SUMS
            "dist/${RELEASE_PLUGIN_ID}-${VERSION}.zip"
          )
          if [[ -f dist/styles.css ]]; then
            assets+=(dist/styles.css)
          fi

          gh release create "$VERSION" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --prerelease \
            --notes-file /tmp/release-notes.md
